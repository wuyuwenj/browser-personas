name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The connect handshake is the maintenance cost of this project: a puppeteer major
        # can change it and break attribution silently, and chrome-devtools-mcp pins its
        # own puppeteer-core. Test against the releases people actually run.
        cdp-mcp: ["1.7.0", "1.8.0", "1.9.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm add -D chrome-devtools-mcp@${{ matrix.cdp-mcp }}
      - run: pnpm test:integration
